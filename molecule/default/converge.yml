---
- name: Converge
  hosts: all
  gather_facts: false

  pre_tasks:
    - name: Install Python (needed for Ansible modules on Void)
      ansible.builtin.raw: xbps-install -Syu -y python3 python3-packaging
      changed_when: true

    - name: Gather facts after Python is available
      ansible.builtin.setup:

    - name: Create dummy vault secrets (molecule doesn't need real secrets)
      ansible.builtin.set_fact:
        bose_mac: "00:00:00:00:00:00"
        gh_token: "dummy"
        ssh_private_key: ""
        ssh_public_key: ""

  roles:
    - role: dotfiles
      vars:
        username: root
        user_home: /root
