---
# Development tools

- name: Install development packages
  community.general.xbps:
    update_cache: false
    name:
      - python3
      - python3-pip
      - lua
      - luarocks
      - go
      - docker
      - docker-compose
      - terraform
      - tflint
      - ansible
      - python3-yamllint
      - shellcheck
      - bash
      - zoxide
      - fzf
      - fd
      - eza
      - curl
      - wget
      - bat
      - ripgrep
      - htop
      - calc
    state: present
  become: true
  tags: [dev]

# Docker configuration
- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ username }}"
    groups: docker
    append: true
  become: true
  tags: [dev, docker]

- name: Enable docker service
  ansible.builtin.file:
    src: /etc/sv/docker
    dest: /var/service/docker
    state: link
  become: true
  tags: [dev, docker]

- name: Enable containerd service
  ansible.builtin.file:
    src: /etc/sv/containerd
    dest: /var/service/containerd
    state: link
  become: true
  tags: [dev, docker]

# bat configuration
- name: Create bat config directory
  ansible.builtin.file:
    path: "{{ user_home }}/.config/bat"
    state: directory
    mode: "0755"
  tags: [dev]

- name: Deploy bat config
  ansible.builtin.copy:
    src: bat/config
    dest: "{{ user_home }}/.config/bat/config"
    mode: "0644"
  tags: [dev]

# ripgrep configuration
- name: Create ripgrep config directory
  ansible.builtin.file:
    path: "{{ user_home }}/.config/ripgrep"
    state: directory
    mode: "0755"
  tags: [dev]

- name: Deploy ripgrep config
  ansible.builtin.copy:
    src: ripgrep/ripgreprc
    dest: "{{ user_home }}/.config/ripgrep/ripgreprc"
    mode: "0644"
  tags: [dev]

# htop configuration
- name: Create htop config directory
  ansible.builtin.file:
    path: "{{ user_home }}/.config/htop"
    state: directory
    mode: "0755"
  tags: [dev]

- name: Deploy htop config
  ansible.builtin.copy:
    src: htop/htoprc
    dest: "{{ user_home }}/.config/htop/htoprc"
    mode: "0644"
  tags: [dev]

# fastfetch configuration
- name: Create fastfetch config directory
  ansible.builtin.file:
    path: "{{ user_home }}/.config/fastfetch"
    state: directory
    mode: "0755"
  tags: [dev]

- name: Deploy fastfetch config
  ansible.builtin.copy:
    src: fastfetch/config.jsonc
    dest: "{{ user_home }}/.config/fastfetch/config.jsonc"
    mode: "0644"
  tags: [dev]
