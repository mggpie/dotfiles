---
- name: Install pipewire
  community.general.xbps:
    name:
      - pipewire
      - wireplumber
      - alsa-pipewire
      - libspa-bluetooth
      - fdk-aac  # AAC codec for Bluetooth
      - pavucontrol  # GTK GUI for audio control (works via pipewire-pulse)
    state: present
  become: true
  tags: [pipewire]

- name: Create WirePlumber 0.5 config directory
  ansible.builtin.file:
    path: "{{ user_home }}/.config/wireplumber/wireplumber.conf.d"
    state: directory
    mode: "0755"
  tags: [pipewire]

- name: Remove old deprecated Lua config directories
  ansible.builtin.file:
    path: "{{ user_home }}/.config/wireplumber/{{ item }}"
    state: absent
  loop:
    - bluetooth.lua.d
    - main.lua.d
    - policy.lua.d
  tags: [pipewire]

- name: Configure Bluetooth AAC codec and Bose QC45
  ansible.builtin.template:
    src: pipewire/50-bluez-config.conf
    dest: "{{ user_home }}/.config/wireplumber/wireplumber.conf.d/50-bluez-config.conf"
    mode: "0644"
  tags: [pipewire]

- name: Configure stream switching policy
  ansible.builtin.copy:
    src: pipewire/50-policy.conf
    dest: "{{ user_home }}/.config/wireplumber/wireplumber.conf.d/50-policy.conf"
    mode: "0644"
  tags: [pipewire]
