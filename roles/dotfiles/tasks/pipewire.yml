---
- name: Install pipewire
  community.general.xbps:
    name:
      - pipewire
      - wireplumber
      - alsa-pipewire
      - libspa-bluetooth
      - fdk-aac  # AAC codec for Bluetooth
      - pavucontrol  # GTK GUI for audio control (works via pipewire-pulse)
    state: present
  become: true
  tags: [pipewire]

- name: Create pipewire config directories
  ansible.builtin.file:
    path: "{{ user_home }}/.config/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - pipewire
    - wireplumber
    - wireplumber/bluetooth.lua.d
    - wireplumber/main.lua.d
    - wireplumber/policy.lua.d
  tags: [pipewire]

- name: Enable AAC codec for Bluetooth
  ansible.builtin.copy:
    content: |
      -- Enable AAC codec for Bluetooth headphones
      bluez_monitor.properties = {
        ["bluez5.enable-sbc-xq"] = true,
        ["bluez5.enable-msbc"] = true,
        ["bluez5.enable-hw-volume"] = true,
        ["bluez5.headset-roles"] = "[ hsp_hs hsp_ag hfp_hf hfp_ag ]",
        ["bluez5.codecs"] = "[ sbc sbc_xq aac ldac aptx aptx_hd ]",
      }
    dest: "{{ user_home }}/.config/wireplumber/bluetooth.lua.d/50-bluez-config.lua"
    mode: "0644"
  tags: [pipewire]

- name: Configure automatic output switching
  ansible.builtin.copy:
    content: |
      -- Automatically switch to newly connected outputs (HDMI/DP)
      rule = {
        matches = {
          {
            { "node.name", "matches", "alsa_output.*" },
          },
        },
        apply_properties = {
          ["device.intended-roles"] = "Multimedia",
        },
      }

      table.insert(alsa_monitor.rules, rule)
    dest: "{{ user_home }}/.config/wireplumber/main.lua.d/50-alsa-config.lua"
    mode: "0644"
  tags: [pipewire]

- name: Enable switch-on-connect policy
  ansible.builtin.copy:
    content: |
      -- Automatically switch to new sinks when they appear
      default_policy.policy = {
        ["move"] = true,  -- move existing streams to new default
        ["follow"] = true,  -- new streams follow the default
      }
    dest: "{{ user_home }}/.config/wireplumber/policy.lua.d/50-endpoints-config.lua"
    mode: "0644"
  tags: [pipewire]
