---
- name: Micro
  tags: [micro]
  block:
    - name: Install micro
      community.general.xbps:
        update_cache: false
        name: micro
        state: present
      become: true

    - name: Create micro config directory
      ansible.builtin.file:
        path: "{{ user_home }}/.config/micro"
        state: directory
        mode: "0755"

    - name: Deploy micro settings.json
      ansible.builtin.copy:
        src: micro/settings.json
        dest: "{{ user_home }}/.config/micro/settings.json"
        mode: "0644"

    - name: Deploy micro bindings.json
      ansible.builtin.copy:
        src: micro/bindings.json
        dest: "{{ user_home }}/.config/micro/bindings.json"
        mode: "0644"

    - name: Create local applications directory
      ansible.builtin.file:
        path: "{{ user_home }}/.local/share/applications"
        state: directory
        mode: "0755"

    - name: Deploy micro desktop override
      ansible.builtin.copy:
        src: micro/micro.desktop
        dest: "{{ user_home }}/.local/share/applications/micro.desktop"
        mode: "0644"
