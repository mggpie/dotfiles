---
# GRUB bootloader configuration for performance

- name: Grub
  tags: [grub]
  become: true
  block:
    - name: Configure GRUB timeout
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_TIMEOUT='
        line: 'GRUB_TIMEOUT=0'
        backup: true
      notify: Regenerate GRUB config

    # WARNING: mitigations=off disables CPU vulnerability mitigations (Spectre/Meltdown/etc.)
    # for performance. NEVER do this on a production or multi-user machine.
    # This is a deliberate tradeoff for a single-user desktop.
    - name: Configure GRUB command line parameters
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX_DEFAULT='
        line: >-
          GRUB_CMDLINE_LINUX_DEFAULT="quiet loglevel=0 udev.log_level=0
          vt.global_cursor_default=0 mitigations=off nowatchdog
          msr.allow_writes=on pcie_aspm=force module.sig_unenforce
          intel_iommu=on iommu=pt no_timer_check noreplace-smp
          page_alloc.shuffle=1 rcupdate.rcu_expedited=1 tsc=reliable
          i915.enable_guc=3 i915.fastboot=1 i915.enable_fbc=0
          i915.enable_psr=0 split_lock_detect=off intel_pstate=active"
        backup: true
      notify: Regenerate GRUB config
