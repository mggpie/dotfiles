---
- name: Imv
  tags: [imv]
  block:
    - name: Install imv
      community.general.xbps:
        update_cache: false
        name: imv
        state: present
      become: true

    - name: Create imv config directory
      ansible.builtin.file:
        path: "{{ user_home }}/.config/imv"
        state: directory
        mode: "0755"

    - name: Deploy imv config
      ansible.builtin.copy:
        src: imv/config
        dest: "{{ user_home }}/.config/imv/config"
        mode: "0644"
