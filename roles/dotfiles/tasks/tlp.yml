---
# TLP installed but not enabled - kernel defaults (schedutil governor) are more
# responsive than TLP powersave mode on desktop, with minimal power savings benefit.
# TLP is primarily useful for laptops on battery.
# To enable manually: doas ln -s /etc/sv/tlp /var/service/tlp
- name: Tlp
  tags: [tlp]
  become: true
  block:
    - name: Install TLP
      community.general.xbps:
        update_cache: false
        name: tlp
        state: present

    - name: Deploy TLP config
      ansible.builtin.copy:
        src: tlp/tlp.conf
        dest: /etc/tlp.conf
        mode: "0644"
