---
# Base system configuration

- name: Bootstrap
  tags: [bootstrap]
  become: true
  become_method: ansible.builtin.su
  block:
    - name: Bootstrap - install doas
      community.general.xbps:
        update_cache: false
        name: opendoas
        state: present

    - name: Bootstrap - configure doas
      ansible.builtin.copy:
        content: |
          permit nopass :wheel
        dest: /etc/doas.conf
        mode: "0400"

- name: Base
  tags: [base]
  block:
    - name: Install base packages
      community.general.xbps:
        update_cache: false
        name:
          - chrony
          - fontconfig
          - cronie
          - elogind
          - dbus
          - xdg-user-dirs
          - xdg-utils
          - udisks2
          - zip
          - unzip
          - ImageMagick
          - ffmpeg
        state: present
      become: true

    - name: Enable nonfree repository
      community.general.xbps:
        update_cache: false
        name: void-repo-nonfree
        state: present
      become: true

    - name: Deploy XDG user-dirs config
      ansible.builtin.copy:
        src: xdg/user-dirs.dirs
        dest: "{{ user_home }}/.config/user-dirs.dirs"
        mode: "0644"

    - name: Prevent xdg-user-dirs-update from overwriting config
      ansible.builtin.copy:
        content: "enabled=False\n"
        dest: "{{ user_home }}/.config/user-dirs.conf"
        mode: "0644"

- name: Base notest
  tags: [base, notest]
  become: true
  block:
    - name: Install CPU microcode
      community.general.xbps:
        update_cache: false
        name: "{{ 'intel-ucode' if cpu_vendor == 'intel' else 'linux-firmware-amd' }}"
        state: present

    - name: Configure auto-login on TTY1
      ansible.builtin.copy:
        content: |
          if [ -x /sbin/agetty -o -x /bin/agetty ]; then
                  GETTY_ARGS="--autologin {{ username }} --noclear"
          fi

          BAUD_RATE=38400
          TERM_NAME=linux
        dest: /etc/sv/agetty-tty1/conf
        mode: "0644"

    - name: Disable TTY 3-6
      ansible.builtin.file:
        path: "/var/service/agetty-tty{{ item }}"
        state: absent
      loop: [3, 4, 5, 6]

    - name: Enable base services
      ansible.builtin.file:
        src: "/etc/sv/{{ item }}"
        dest: "/var/service/{{ item }}"
        state: link
      loop:
        - chronyd
        - dbus
        - cronie

    - name: Disable power button in elogind (handled by sway)
      ansible.builtin.lineinfile:
        path: /etc/elogind/logind.conf
        regexp: '^#?HandlePowerKey='
        line: 'HandlePowerKey=ignore'

    - name: Enable sshd service
      ansible.builtin.file:
        path: /var/service/sshd
        state: link
        src: /etc/sv/sshd
        mode: "0777"

# Nix package manager

- name: Nix
  tags: [base, nix]
  block:
    - name: Check if Nix is installed
      ansible.builtin.stat:
        path: "{{ user_home }}/.nix-profile/etc/profile.d/nix.sh"
      register: dotfiles_nix_installed

    - name: Install Nix
      ansible.builtin.shell: |
        set -o pipefail
        curl -L https://nixos.org/nix/install | sh -s -- --no-daemon
      args:
        executable: /bin/bash
      when: not dotfiles_nix_installed.stat.exists
      changed_when: true

    - name: Add nixpkgs unstable channel
      ansible.builtin.shell: |
        . ~/.nix-profile/etc/profile.d/nix.sh
        nix-channel --add https://nixos.org/channels/nixpkgs-unstable nixpkgs
        nix-channel --update
      args:
        executable: /bin/bash
      when: not dotfiles_nix_installed.stat.exists
      changed_when: true

    - name: Create Nix config directory
      ansible.builtin.file:
        path: "{{ user_home }}/.config/nix"
        state: directory
        mode: "0755"

    - name: Enable Nix experimental features
      ansible.builtin.copy:
        content: |
          experimental-features = nix-command flakes
        dest: "{{ user_home }}/.config/nix/nix.conf"
        mode: "0644"
