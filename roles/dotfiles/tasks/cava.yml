---
- name: Install cava
  community.general.xbps:
    update_cache: false
    name: cava
    state: present
  become: true
  tags: [cava]

- name: Create cava config directory
  ansible.builtin.file:
    path: "{{ user_home }}/.config/cava"
    state: directory
    mode: "0755"
  tags: [cava]

- name: Deploy cava config
  ansible.builtin.copy:
    src: cava/config
    dest: "{{ user_home }}/.config/cava/config"
    mode: "0644"
  tags: [cava]
