---
- name: Tailscale
  tags: [tailscale, notest]
  block:
    - name: Install Tailscale
      community.general.xbps:
        update_cache: false
        name: tailscale
        state: present
      become: true

    - name: Enable tailscaled service
      ansible.builtin.file:
        src: /etc/sv/tailscaled
        dest: /var/service/tailscaled
        state: link
      become: true
