---
- name: VLC
  tags: [vlc]
  block:
    - name: Install VLC
      community.general.xbps:
        update_cache: false
        name:
          - vlc
        state: present
      become: true

    - name: Create VLC config directory
      ansible.builtin.file:
        path: "{{ user_home }}/.config/vlc"
        state: directory
        mode: "0755"

    - name: Deploy VLC config
      ansible.builtin.copy:
        src: vlc/vlcrc
        dest: "{{ user_home }}/.config/vlc/vlcrc"
        mode: "0644"
