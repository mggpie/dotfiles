---
# Intel integrated graphics drivers

- name: Intel-graphics
  tags: [intel-graphics, graphics]
  block:
    - name: Install Intel graphics drivers
      community.general.xbps:
        update_cache: false
        name:
          - mesa
          - mesa-dri
          - mesa-vulkan-intel
          - intel-video-accel
          - libva-intel-driver
          - intel-media-driver
        state: present
      become: true
