---
- name: Install mpv
  community.general.xbps:
    name: mpv
    state: present
  become: true
  tags: [mpv]

- name: Create mpv config directory
  ansible.builtin.file:
    path: "{{ user_home }}/.config/mpv"
    state: directory
    mode: "0755"
  tags: [mpv]

- name: Deploy mpv config
  ansible.builtin.copy:
    src: mpv/mpv.conf
    dest: "{{ user_home }}/.config/mpv/mpv.conf"
    mode: "0644"
  tags: [mpv]

- name: Deploy mpv keybindings
  ansible.builtin.copy:
    src: mpv/input.conf
    dest: "{{ user_home }}/.config/mpv/input.conf"
    mode: "0644"
  tags: [mpv]

- name: Create mpv scripts directory
  ansible.builtin.file:
    path: "{{ user_home }}/.config/mpv/scripts"
    state: directory
    mode: "0755"
  tags: [mpv]

- name: Create watch_later directory
  ansible.builtin.file:
    path: "{{ user_home }}/.local/share/mpv/watch_later"
    state: directory
    mode: "0755"
  tags: [mpv]

- name: Install yt-dlp for YouTube support
  community.general.xbps:
    name: yt-dlp
    state: present
  become: true
  tags: [mpv]

- name: Install subliminal for subtitle downloading
  community.general.xbps:
    name: subliminal
    state: present
  become: true
  tags: [mpv]
