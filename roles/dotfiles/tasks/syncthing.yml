---
- name: Syncthing
  tags: [syncthing, notest]
  block:
    - name: Install syncthing
      community.general.xbps:
        name: syncthing
        state: present
      become: true

    - name: Ensure syncthing config directory exists
      ansible.builtin.file:
        path: "{{ ansible_user_dir }}/.local/state/syncthing"
        state: directory
        mode: '0700'

    - name: Generate syncthing keys if not present
      ansible.builtin.command:
        cmd: syncthing generate
        creates: "{{ ansible_user_dir }}/.local/state/syncthing/cert.pem"

    - name: Start syncthing daemon temporarily for API configuration
      ansible.builtin.shell:
        cmd: STNOUPGRADE=1 STNORESTART=1 nohup syncthing serve --no-browser > /dev/null 2>&1 & echo $!
      register: syncthing_pid

    - name: Wait for syncthing API to be ready
      ansible.builtin.wait_for:
        port: 8384
        host: 127.0.0.1
        state: started
        delay: 3
        timeout: 30

    - name: Extract syncthing API key from config.xml
      ansible.builtin.shell:
        cmd: awk -F'[<>]' '/<apikey>/{print $3}' "{{ ansible_user_dir }}/.local/state/syncthing/config.xml"
      register: syncthing_api_key_result

    - name: Set syncthing API key fact
      ansible.builtin.set_fact:
        syncthing_api_key: "{{ syncthing_api_key_result.stdout }}"

    # PARA directories are created by para.yml — no need to duplicate here.
    - name: Configure syncthing folder for each PARA folder
      ansible.builtin.uri:
        url: "http://127.0.0.1:8384/rest/config/folders"
        method: PUT
        headers:
          X-API-Key: "{{ syncthing_api_key }}"
        body:
          id: "para-{{ item.folder }}"
          path: "{{ ansible_user_dir }}/{{ item.folder }}"
          type: "sendreceive"
          versioning:
            type: "staggered"
            params:
              maxAge: "2592000"
        body_format: json
        status_code: [200, 201]
      loop:
        - { folder: "0-Inbox" }
        - { folder: "1-Projects" }
        - { folder: "2-Areas" }
        - { folder: "3-Resources" }
        - { folder: "4-Archives" }
      ignore_errors: true

    - name: Stop temporary syncthing daemon
      ansible.builtin.shell:
        cmd: kill {{ syncthing_pid.stdout }} 2>/dev/null || true
      changed_when: false

    # Runit service - start syncthing on boot, independent of terminal sessions.
    # ----------------------------------------------------------------------
    - name: Ensure runit service directory exists
      ansible.builtin.file:
        path: /etc/sv/syncthing
        state: directory
        mode: "0755"
      become: true

    - name: Deploy syncthing run script
      ansible.builtin.template:
        src: "{{ role_path }}/files/runit/syncthing/run"
        dest: /etc/sv/syncthing/run
        mode: "0755"
      become: true

    - name: Enable syncthing runit service
      ansible.builtin.file:
        src: /etc/sv/syncthing
        dest: /var/service/syncthing
        state: link
      become: true
