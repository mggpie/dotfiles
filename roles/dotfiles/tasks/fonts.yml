---
# Fonts configuration

- name: Install fonts from xbps
  community.general.xbps:
    name:
      - font-inter
      - nerd-fonts
      - noto-fonts-emoji
    state: present
  become: true
  tags: [fonts]

- name: Install Intel One Mono from nix
  ansible.builtin.shell: |
    . ~/.nix-profile/etc/profile.d/nix.sh
    nix-env -iA nixpkgs.intel-one-mono
  args:
    executable: /bin/bash
  register: dotfiles_fonts_nix
  changed_when: "'installing' in dotfiles_fonts_nix.stdout"
  tags: [fonts]

- name: Create fontconfig directory
  ansible.builtin.file:
    path: "{{ user_home }}/.config/fontconfig"
    state: directory
    mode: "0755"
  tags: [fonts]

- name: Deploy fontconfig for emoji
  ansible.builtin.copy:
    src: fontconfig/fonts.conf
    dest: "{{ user_home }}/.config/fontconfig/fonts.conf"
    mode: "0644"
  tags: [fonts]

- name: Refresh font cache
  ansible.builtin.command: fc-cache -fv
  changed_when: false
  tags: [fonts]
