---
# Fonts configuration

- name: Fonts
  tags: [fonts]
  block:
    - name: Install fonts from xbps
      community.general.xbps:
        update_cache: false
        name:
          - font-inter
          - nerd-fonts
          - noto-fonts-emoji
          - cherry-font
        state: present
      become: true

    - name: Install or upgrade Intel One Mono from Nix
      ansible.builtin.shell: |
        set -o pipefail
        . ~/.nix-profile/etc/profile.d/nix.sh
        before=$(nix profile list 2>/dev/null | awk '/^Name:[[:space:]]+intel-one-mono$/{found=1} found && /^Store paths:/{print $NF; found=0}')
        if [ -z "$before" ]; then
          nix profile install nixpkgs#intel-one-mono
        else
          nix profile upgrade intel-one-mono
          after=$(nix profile list 2>/dev/null | awk '/^Name:[[:space:]]+intel-one-mono$/{found=1} found && /^Store paths:/{print $NF; found=0}')
          [ "$before" = "$after" ] && echo "UNCHANGED"
        fi
      args:
        executable: /bin/bash
      register: dotfiles_intel_mono_install
      changed_when: "'UNCHANGED' not in dotfiles_intel_mono_install.stdout"
      failed_when: dotfiles_intel_mono_install.rc != 0

    - name: Create fontconfig directory
      ansible.builtin.file:
        path: "{{ user_home }}/.config/fontconfig"
        state: directory
        mode: "0755"

    - name: Deploy fontconfig for emoji
      ansible.builtin.copy:
        src: fontconfig/fonts.conf
        dest: "{{ user_home }}/.config/fontconfig/fonts.conf"
        mode: "0644"

    - name: Refresh font cache
      ansible.builtin.command: fc-cache -fv
      changed_when: false

    - name: Install terminus-font for TTY
      community.general.xbps:
        update_cache: false
        name:
          - terminus-font
        state: present
      become: true

    - name: Set console (TTY) font to Terminus
      ansible.builtin.lineinfile:
        path: /etc/rc.conf
        regexp: '^FONT='
        line: 'FONT=ter-v16b'
        create: true
        mode: "0644"
      become: true
