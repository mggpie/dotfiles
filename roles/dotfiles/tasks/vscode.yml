---
- name: Install VSCode via Nix
  ansible.builtin.shell: |
    . ~/.nix-profile/etc/profile.d/nix.sh
    nix profile list | grep -q vscode || nix profile install nixpkgs#vscode
  args:
    executable: /bin/bash
  changed_when: false
  ignore_errors: true
  tags: [vscode]

- name: Create VSCode config directory
  ansible.builtin.file:
    path: "{{ user_home }}/.config/Code/User"
    state: directory
    mode: "0755"
  tags: [vscode]

- name: Deploy VSCode settings
  ansible.builtin.copy:
    src: vscode/settings.json
    dest: "{{ user_home }}/.config/Code/User/settings.json"
    mode: "0644"
  tags: [vscode]

- name: Create VSCode flags directory
  ansible.builtin.file:
    path: "{{ user_home }}/.config/code-flags.conf"
    state: touch
    mode: "0644"
  tags: [vscode]

- name: Deploy VSCode Wayland flags
  ansible.builtin.copy:
    src: vscode/code-flags.conf
    dest: "{{ user_home }}/.config/code-flags.conf"
    mode: "0644"
  tags: [vscode]
