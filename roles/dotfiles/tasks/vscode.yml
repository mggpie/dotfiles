---
- name: Vscode
  tags: [vscode]
  block:
    - name: Install or upgrade VSCode via Nix
      ansible.builtin.shell: |
        set -o pipefail
        . ~/.nix-profile/etc/profile.d/nix.sh
        before=$(nix profile list 2>/dev/null | awk '/^Name:[[:space:]]+vscode$/{found=1} found && /^Store paths:/{print $NF; found=0}')
        has_flake=$(nix profile list 2>/dev/null | awk '/^Name:[[:space:]]+vscode$/{found=1; next} found && /^Name:/{found=0} found && /^Original flake URL:/{print "yes"; found=0}')
        if [ -z "$before" ]; then
          NIXPKGS_ALLOW_UNFREE=1 nix profile install nixpkgs#vscode --impure
        elif [ -z "$has_flake" ]; then
          # Installed without flake metadata - migrate so future upgrades work
          nix profile remove vscode
          NIXPKGS_ALLOW_UNFREE=1 nix profile install nixpkgs#vscode --impure
        else
          NIXPKGS_ALLOW_UNFREE=1 nix profile upgrade vscode --impure
          after=$(nix profile list 2>/dev/null | awk '/^Name:[[:space:]]+vscode$/{found=1} found && /^Store paths:/{print $NF; found=0}')
          [ "$before" = "$after" ] && echo "UNCHANGED"
        fi
      args:
        executable: /bin/bash
      register: dotfiles_vscode_install
      changed_when: "'UNCHANGED' not in dotfiles_vscode_install.stdout"
      failed_when: dotfiles_vscode_install.rc != 0

    - name: Create VSCode config directory
      ansible.builtin.file:
        path: "{{ user_home }}/.config/Code/User"
        state: directory
        mode: "0755"

    - name: Deploy VSCode settings
      ansible.builtin.copy:
        src: vscode/settings.json
        dest: "{{ user_home }}/.config/Code/User/settings.json"
        mode: "0644"

    - name: Deploy VSCode Wayland flags
      ansible.builtin.copy:
        src: vscode/code-flags.conf
        dest: "{{ user_home }}/.config/code-flags.conf"
        mode: "0644"

    # OpenChamber is the OpenCode GUI frontend. Manage it here so the install is
    # reproducible instead of a manual step that silently drifts from the repo.
    - name: List installed VSCode extensions
      ansible.builtin.command: "{{ user_home }}/.nix-profile/bin/code --list-extensions"
      register: dotfiles_vscode_extensions
      changed_when: false

    - name: Install OpenChamber extension (OpenCode GUI frontend)
      ansible.builtin.command: "{{ user_home }}/.nix-profile/bin/code --install-extension fedaykindev.openchamber"
      when: "'fedaykindev.openchamber' not in dotfiles_vscode_extensions.stdout"
