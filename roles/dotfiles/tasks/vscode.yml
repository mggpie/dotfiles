---
- name: Vscode
  tags: [vscode]
  block:
    - name: Install VSCode via Nix
      ansible.builtin.shell: |
        set -o pipefail
        . ~/.nix-profile/etc/profile.d/nix.sh
        if nix profile list | grep -q vscode; then
          echo "ALREADY_INSTALLED"
        else
          nix profile install nixpkgs#vscode
        fi
      args:
        executable: /bin/bash
      register: dotfiles_vscode_install
      changed_when: "'ALREADY_INSTALLED' not in dotfiles_vscode_install.stdout"
      failed_when: dotfiles_vscode_install.rc != 0 and 'ALREADY_INSTALLED' not in dotfiles_vscode_install.stdout

    - name: Create VSCode config directory
      ansible.builtin.file:
        path: "{{ user_home }}/.config/Code/User"
        state: directory
        mode: "0755"

    - name: Deploy VSCode settings
      ansible.builtin.copy:
        src: vscode/settings.json
        dest: "{{ user_home }}/.config/Code/User/settings.json"
        mode: "0644"

    - name: Deploy VSCode Wayland flags
      ansible.builtin.copy:
        src: vscode/code-flags.conf
        dest: "{{ user_home }}/.config/code-flags.conf"
        mode: "0644"
