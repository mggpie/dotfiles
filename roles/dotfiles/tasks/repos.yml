---
- name: Create PARA directories
  ansible.builtin.file:
    path: "{{ user_home }}/Desktop/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - 1-Projects
    - 4-Archives
  tags: [repos]

- name: Get list of all repos from GitHub
  ansible.builtin.command:
    cmd: gh repo list --json name,sshUrl --limit 100 --no-archived
  register: repos_list
  changed_when: false
  become: false
  tags: [repos]

- name: Clone active repos to projects
  ansible.builtin.git:
    repo: "{{ item.sshUrl }}"
    dest: "{{ user_home }}/Desktop/1-Projects/{{ item.name }}"
    update: false
  loop: "{{ repos_list.stdout | from_json | selectattr('name', 'in', repos_active) }}"
  loop_control:
    label: "{{ item.name }}"
  become: false
  tags: [repos]

- name: Clone remaining repos to archive
  ansible.builtin.git:
    repo: "{{ item.sshUrl }}"
    dest: "{{ user_home }}/Desktop/4-Archives/{{ item.name }}"
    update: false
  loop: "{{ repos_list.stdout | from_json | rejectattr('name', 'in', repos_active) }}"
  loop_control:
    label: "{{ item.name }}"
  become: false
  tags: [repos]

- name: Deploy repos-sync script
  ansible.builtin.template:
    src: repos-sync.j2
    dest: "{{ user_home }}/.local/bin/repos-sync"
    mode: "0755"
  become: false
  tags: [repos]

- name: Remove old repos reminder cron
  ansible.builtin.cron:
    name: "repos-reorganize-reminder"
    state: absent
    user: "{{ username }}"
  tags: [repos]

- name: Daily repos sync cron
  ansible.builtin.cron:
    name: repos-sync
    special_time: daily
    job: "{{ user_home }}/.local/bin/repos-sync"
    user: "{{ username }}"
  tags: [repos]
