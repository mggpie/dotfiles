---
- name: Create archive directory
  ansible.builtin.file:
    path: "{{ user_home }}/Desktop/4-Archives"
    state: directory
    mode: "0755"
  tags: [repos]

- name: Create projects directory
  ansible.builtin.file:
    path: "{{ user_home }}/Desktop/1-Projects"
    state: directory
    mode: "0755"
  tags: [repos]

- name: Get list of all repos from GitHub
  ansible.builtin.command:
    cmd: gh repo list --json name,sshUrl --limit 100 --no-archived
  register: repos_list
  changed_when: false
  become: false
  tags: [repos]

- name: Clone dotfiles to projects
  ansible.builtin.git:
    repo: "{{ item.sshUrl }}"
    dest: "{{ user_home }}/Desktop/1-Projects/{{ item.name }}"
    update: false
  loop: "{{ repos_list.stdout | from_json | selectattr('name', 'in', ['dotfiles', 'void-installer']) }}"
  loop_control:
    label: "{{ item.name }}"
  become: false
  tags: [repos]

- name: Clone remaining repos to archive
  ansible.builtin.git:
    repo: "{{ item.sshUrl }}"
    dest: "{{ user_home }}/Desktop/4-Archives/{{ item.name }}"
    update: false
  loop: "{{ repos_list.stdout | from_json | rejectattr('name', 'in', ['dotfiles', 'void-installer']) }}"
  loop_control:
    label: "{{ item.name }}"
  become: false
  tags: [repos]

- name: Monthly reminder to reorganize repos (runs on reboot if 30+ days passed)
  ansible.builtin.cron:
    name: "repos-reorganize-reminder"
    special_time: reboot
    job: >-
      state={{ user_home }}/.local/share/repos-reminder-last;
      if [ ! -f "$state" ] || [ $(( ($(date +%s) - $(cat "$state")) / 86400 )) -ge 30 ]; then
      sleep 30 &&
      echo "[$(date '+%Y-%m-%d')] Review repos - move active to 1-Projects or 2-Areas, rest stays in 4-Archives. Edit roles/dotfiles/tasks/repos.yml to update."
      >> {{ user_home }}/Desktop/0-Inbox/reminders.md &&
      date +%s > "$state";
      fi
    user: "{{ username }}"
  tags: [repos]
