---
- name: Install sway
  community.general.xbps:
    update_cache: false
    name:
      - sway
      - swaylock
      - swayidle
      - wl-clipboard
      - wl-clip-persist
      - grim
      - slurp
    state: present
  become: true
  tags: [sway]

- name: Create sway config directory
  ansible.builtin.file:
    path: "{{ user_home }}/.config/sway"
    state: directory
    mode: "0755"
  tags: [sway]

- name: Deploy sway config
  ansible.builtin.copy:
    src: sway/config
    dest: "{{ user_home }}/.config/sway/config"
    mode: "0644"
  tags: [sway]

- name: Install wlrctl from nix
  ansible.builtin.command:
    cmd: nix {{ dotfiles_nix_experimental_flags }} profile install nixpkgs#wlrctl
  register: dotfiles_wlrctl_install
  changed_when: "'already installed' not in dotfiles_wlrctl_install.stderr"
  failed_when: dotfiles_wlrctl_install.rc != 0 and 'already installed' not in dotfiles_wlrctl_install.stderr
  tags: [sway]
