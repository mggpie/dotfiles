---
- name: Create PARA folder structure
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - ~/Desktop/0-Inbox
    - ~/Desktop/1-Projects
    - ~/Desktop/2-Areas
    - ~/Desktop/3-Resources
    - ~/Desktop/4-Archives
  tags: para

- name: Create notepad.md file
  ansible.builtin.copy:
    content: |
      
      Notepad
      =======
    dest: ~/Desktop/0-Inbox/notepad.md
    force: no
    mode: '0644'
  tags: para

- name: Add move-downloads to user crontab
  ansible.builtin.cron:
    name: "Move Downloads to Inbox"
    minute: "0"
    hour: "*"
    job: "fish -c move-downloads"
    user: "{{ ansible_user_id }}"
  tags: para
