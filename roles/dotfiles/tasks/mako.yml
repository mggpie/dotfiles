---
- name: Mako
  tags: [mako]
  block:
    - name: Install mako
      community.general.xbps:
        update_cache: false
        name: mako
        state: present
      become: true

    - name: Create mako config directory
      ansible.builtin.file:
        path: "{{ user_home }}/.config/mako"
        state: directory
        mode: "0755"

    - name: Deploy mako config
      ansible.builtin.copy:
        src: mako/config
        dest: "{{ user_home }}/.config/mako/config"
        mode: "0644"
