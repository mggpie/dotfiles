---
- name: Fish
  tags: [fish]
  block:
    - name: Install fish
      community.general.xbps:
        update_cache: false
        name: fish-shell
        state: present
      become: true

    - name: Set fish as default shell
      ansible.builtin.user:
        name: "{{ username }}"
        shell: /bin/fish
      become: true

    - name: Create fish config directory
      ansible.builtin.file:
        path: "{{ user_home }}/.config/fish"
        state: directory
        mode: "0755"

    - name: Deploy fish config
      ansible.builtin.copy:
        src: fish/config.fish
        dest: "{{ user_home }}/.config/fish/config.fish"
        mode: "0644"

    - name: Deploy fish functions
      ansible.builtin.copy:
        src: fish/functions/
        dest: "{{ user_home }}/.config/fish/functions/"
        mode: "0644"

    - name: Remove obsolete move-downloads function
      ansible.builtin.file:
        path: "{{ user_home }}/.config/fish/functions/move-downloads.fish"
        state: absent

    - name: Deploy fish conf.d (excluding env.fish - rendered separately)
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ user_home }}/.config/fish/conf.d/"
        mode: "0644"
      with_fileglob:
        - "{{ role_path }}/files/fish/conf.d/*.fish"
      when: item | basename != 'env.fish'

    - name: Render env.fish template (secrets injection)
      ansible.builtin.template:
        src: "{{ role_path }}/files/fish/conf.d/env.fish"
        dest: "{{ user_home }}/.config/fish/conf.d/env.fish"
        mode: "0644"

    - name: Remove legacy crontab entry (renamed)
      ansible.builtin.cron:
        name: "Auto-run upall weekly"
        state: absent
        user: "{{ username }}"

    - name: Add upall-check to user crontab (runs on boot, weekly interval)
      ansible.builtin.cron:
        name: "Run upall-check on boot"
        special_time: reboot
        job: "/bin/fish -c upall-check"
        user: "{{ username }}"
