---
- name: Install fish
  community.general.xbps:
    update_cache: false
    name: fish-shell
    state: present
  become: true
  tags: [fish]

- name: Set fish as default shell
  ansible.builtin.user:
    name: "{{ username }}"
    shell: /bin/fish
  become: true
  tags: [fish]

- name: Create fish config directory
  ansible.builtin.file:
    path: "{{ user_home }}/.config/fish"
    state: directory
    mode: "0755"
  tags: [fish]

- name: Deploy fish config
  ansible.builtin.copy:
    src: fish/config.fish
    dest: "{{ user_home }}/.config/fish/config.fish"
    mode: "0644"
  tags: [fish]

- name: Deploy fish functions
  ansible.builtin.copy:
    src: fish/functions/
    dest: "{{ user_home }}/.config/fish/functions/"
    mode: "0644"
  tags: [fish]

- name: Deploy fish conf.d
  ansible.builtin.template:
    src: "{{ role_path }}/files/fish/conf.d/{{ item | basename }}"
    dest: "{{ user_home }}/.config/fish/conf.d/{{ item | basename }}"
    mode: "0644"
  loop: "{{ lookup('fileglob', role_path + '/files/fish/conf.d/*', wantlist=True) }}"
  loop_control:
    label: "{{ item | basename }}"
  tags: [fish]

- name: Add upall-check to user crontab
  ansible.builtin.cron:
    name: "Auto-run upall weekly"
    special_time: reboot
    job: "/bin/fish -c upall-check"
    user: "{{ username }}"
  tags: [fish]
