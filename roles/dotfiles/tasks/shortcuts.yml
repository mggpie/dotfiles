---
- name: Create shortcuts directory
  ansible.builtin.file:
    path: "{{ user_home }}/.local/bin"
    state: directory
    mode: "0755"
  tags: [shortcuts]

- name: Create browser shortcut
  ansible.builtin.copy:
    content: |
      #!/bin/sh
      exec ${BROWSER:-firefox-wayland} "$@"
    dest: "{{ user_home }}/.local/bin/browser"
    mode: "0755"
  tags: [shortcuts]

- name: Create edit shortcut
  ansible.builtin.copy:
    content: |
      #!/bin/sh
      exec ${EDITOR:-micro} "$@"
    dest: "{{ user_home }}/.local/bin/edit"
    mode: "0755"
  tags: [shortcuts]

- name: Create file shortcut
  ansible.builtin.copy:
    content: |
      #!/bin/sh
      exec ${FILE_MANAGER:-pcmanfm} "$@"
    dest: "{{ user_home }}/.local/bin/file"
    mode: "0755"
  tags: [shortcuts]

- name: Create files shortcut (alias)
  ansible.builtin.copy:
    content: |
      #!/bin/sh
      exec ${FILE_MANAGER:-pcmanfm} "$@"
    dest: "{{ user_home }}/.local/bin/files"
    mode: "0755"
