- name: Create trash shortcut
  ansible.builtin.copy:
    content: |
      #!/bin/sh
      exec ${FILE_MANAGER:-thunar} ${HOME}/.local/share/Trash/files
    dest: "{{ user_home }}/.local/bin/trash"
    mode: "0755"
  tags: [shortcuts]

- name: Create screenshot shortcut
  ansible.builtin.copy:
    content: |
      #!/bin/sh
      mkdir -p $HOME/Pictures/Screenshots
      grim -g "$(slurp)" - | tee $HOME/Pictures/Screenshots/$(date +%Y%m%d-%H%M%S).png | wl-copy
    dest: "{{ user_home }}/.local/bin/screenshot"
    mode: "0755"
  tags: [shortcuts]

- name: Create fixaudio shortcut
  ansible.builtin.copy:
    content: |
      #!/bin/sh
      (systemctl --user restart pipewire pipewire-pulse wireplumber &) >/dev/null 2>&1
    dest: "{{ user_home }}/.local/bin/fixaudio"
    mode: "0755"
  tags: [shortcuts]

