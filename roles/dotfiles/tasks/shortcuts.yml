---
- name: Create shortcuts directory
  ansible.builtin.file:
    path: "{{ user_home }}/.local/bin"
    state: directory
    mode: "0755"
  tags: [shortcuts]

- name: Create browser shortcut
  ansible.builtin.copy:
    src: shortcuts/browser
    dest: "{{ user_home }}/.local/bin/browser"
    mode: "0755"
  tags: [shortcuts]

