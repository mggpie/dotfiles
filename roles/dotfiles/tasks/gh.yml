---
- name: Gh
  tags: [gh]
  block:
    - name: Load secrets
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/secrets.yml"

    - name: Install github-cli
      community.general.xbps:
        update_cache: false
        name: github-cli
        state: present
      become: true

    - name: Create gh config directory
      ansible.builtin.file:
        path: "{{ user_home }}/.config/gh"
        state: directory
        mode: "0700"

    - name: Deploy gh config.yml
      ansible.builtin.copy:
        src: gh/config.yml
        dest: "{{ user_home }}/.config/gh/config.yml"
        mode: "0600"

    - name: Deploy gh hosts.yml from secrets
      ansible.builtin.copy:
        content: "{{ gh_hosts_yml }}"
        dest: "{{ user_home }}/.config/gh/hosts.yml"
        mode: "0600"
      when: gh_hosts_yml is defined
