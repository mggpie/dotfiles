---
- name: Install mpd and ncmpcpp
  community.general.xbps:
    update_cache: false
    name:
      - mpd
      - ncmpcpp
    state: present
  become: true
  tags: [mpd]

- name: Create MPD directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ user_home }}/.config/mpd"
    - "{{ user_home }}/.config/mpd/playlists"
    - "{{ user_home }}/.local/state/mpd"
  tags: [mpd]

- name: Deploy MPD configuration
  ansible.builtin.copy:
    src: mpd/mpd.conf
    dest: "{{ user_home }}/.config/mpd/mpd.conf"
    mode: "0644"
  tags: [mpd]

- name: Create ncmpcpp config directory
  ansible.builtin.file:
    path: "{{ user_home }}/.config/ncmpcpp"
    state: directory
    mode: "0755"
  tags: [mpd]

- name: Deploy ncmpcpp configuration
  ansible.builtin.copy:
    src: ncmpcpp/config
    dest: "{{ user_home }}/.config/ncmpcpp/config"
    mode: "0644"
  tags: [mpd]

# Note: MPD will be started automatically on first use by socket activation
# or can be started manually with: mpd
