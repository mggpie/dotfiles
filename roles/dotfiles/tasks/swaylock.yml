---
- name: Swaylock
  tags: [swaylock]
  block:
    - name: Install swaylock
      community.general.xbps:
        update_cache: false
        name: swaylock
        state: present
      become: true

    - name: Install swayidle
      community.general.xbps:
        update_cache: false
        name: swayidle
        state: present
      become: true

    - name: Create swaylock config directory
      ansible.builtin.file:
        path: "{{ user_home }}/.config/swaylock"
        state: directory
        mode: "0755"

    - name: Deploy swaylock configuration
      ansible.builtin.copy:
        src: swaylock/config
        dest: "{{ user_home }}/.config/swaylock/config"
        mode: "0644"

    - name: Deploy lock screen image
      ansible.builtin.copy:
        src: swaylock/lockscreen.png
        dest: "{{ user_home }}/.config/swaylock/lockscreen.png"
        mode: "0644"
