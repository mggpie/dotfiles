---
- name: Install wezterm
  community.general.xbps:
    name: wezterm
    state: present
  become: true
  tags: [wezterm]

- name: Create wezterm config directory
  ansible.builtin.file:
    path: "{{ user_home }}/.config/wezterm"
    state: directory
    mode: "0755"
  tags: [wezterm]

- name: Deploy wezterm config
  ansible.builtin.copy:
    src: wezterm/wezterm.lua
    dest: "{{ user_home }}/.config/wezterm/wezterm.lua"
    mode: "0644"
  tags: [wezterm]
