---
- name: Foot
  tags: [foot]
  block:
    - name: Install foot
      community.general.xbps:
        update_cache: false
        name: foot
        state: present
      become: true

    - name: Create foot config directory
      ansible.builtin.file:
        path: "{{ user_home }}/.config/foot"
        state: directory
        mode: "0755"

    - name: Deploy foot config
      ansible.builtin.copy:
        src: foot/foot.ini
        dest: "{{ user_home }}/.config/foot/foot.ini"
        mode: "0644"
