---
- name: Ssh
  tags: [ssh]
  block:
    - name: Create SSH directory
      ansible.builtin.file:
        path: "{{ user_home }}/.ssh"
        state: directory
        mode: "0700"

    - name: Create SSH control sockets directory
      ansible.builtin.file:
        path: "{{ user_home }}/.ssh/sockets"
        state: directory
        mode: "0700"

    - name: Deploy SSH config
      ansible.builtin.copy:
        src: ssh/config
        dest: "{{ user_home }}/.ssh/config"
        mode: "0600"

    - name: Load secrets for SSH keys
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/secrets.yml"

    - name: Deploy SSH private key from vault
      ansible.builtin.copy:
        content: "{{ ssh_private_key }}"
        dest: "{{ user_home }}/.ssh/id_ed25519"
        mode: "0600"
      when: ssh_private_key is defined
      no_log: true

    - name: Deploy SSH public key from vault
      ansible.builtin.copy:
        content: "{{ ssh_public_key }}"
        dest: "{{ user_home }}/.ssh/id_ed25519.pub"
        mode: "0644"
      when: ssh_public_key is defined
      no_log: true

    - name: Deploy authorized_keys from vault
      ansible.builtin.copy:
        content: "{{ ssh_authorized_keys }}\n"
        dest: "{{ user_home }}/.ssh/authorized_keys"
        mode: "0600"
      when: ssh_authorized_keys is defined
      no_log: true

    # Force key-only auth - password login is a brute-force surface
    - name: Disable SSH password authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
      become: true
      notify: Restart sshd

    - name: Enable SSH public key authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PubkeyAuthentication'
        line: 'PubkeyAuthentication yes'
      become: true
      notify: Restart sshd
