---
- name: Create SSH directory
  ansible.builtin.file:
    path: "{{ user_home }}/.ssh"
    state: directory
    mode: "0700"
  tags: [ssh]

- name: Create SSH control sockets directory
  ansible.builtin.file:
    path: "{{ user_home }}/.ssh/sockets"
    state: directory
    mode: "0700"
  tags: [ssh]

- name: Deploy SSH config
  ansible.builtin.copy:
    src: ssh/config
    dest: "{{ user_home }}/.ssh/config"
    mode: "0600"
  tags: [ssh]

- name: Load secrets for SSH keys
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/secrets.yml"
  tags: [ssh]

- name: Deploy SSH private key from vault
  ansible.builtin.copy:
    content: "{{ ssh_private_key }}"
    dest: "{{ user_home }}/.ssh/id_ed25519"
    mode: "0600"
  when: ssh_private_key is defined
  tags: [ssh]

- name: Deploy SSH public key from vault
  ansible.builtin.copy:
    content: "{{ ssh_public_key }}"
    dest: "{{ user_home }}/.ssh/id_ed25519.pub"
    mode: "0644"
  when: ssh_public_key is defined
  tags: [ssh]
