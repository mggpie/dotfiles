---
- name: Install OpenRGB
  community.general.xbps:
    name:
      - openrgb
      - i2c-tools
    state: present
  become: true
  tags: [openrgb]

- name: Load i2c-dev kernel module
  community.general.modprobe:
    name: i2c-dev
    state: present
  become: true
  tags: [openrgb]

- name: Persist i2c-dev module on boot
  ansible.builtin.copy:
    content: "i2c-dev\n"
    dest: /etc/modules-load.d/i2c-dev.conf
    mode: "0644"
  become: true
  tags: [openrgb]

- name: Add user to i2c group
  ansible.builtin.user:
    name: "{{ username }}"
    groups: i2c
    append: true
  become: true
  tags: [openrgb]
