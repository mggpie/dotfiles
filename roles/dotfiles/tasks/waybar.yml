---
- name: Waybar
  tags: [waybar]
  block:
    - name: Install waybar
      community.general.xbps:
        update_cache: false
        name:
          - Waybar
          - adwaita-fonts
          - jq
        state: present
      become: true

    - name: Create waybar config directory
      ansible.builtin.file:
        path: "{{ user_home }}/.config/waybar"
        state: directory
        mode: "0755"

    - name: Deploy waybar config
      ansible.builtin.copy:
        src: "waybar/{{ item }}"
        dest: "{{ user_home }}/.config/waybar/{{ item }}"
        mode: "0644"
      loop:
        - config
        - style.css
