---
- name: DeaDBeeF
  tags: [deadbeef]
  block:
    - name: Install DeaDBeeF and plugins
      community.general.xbps:
        update_cache: false
        name:
          - deadbeef
          - deadbeef-fb
          - deadbeef-waveform-seekbar
        state: present
      become: true

    - name: Create DeaDBeeF config directory
      ansible.builtin.file:
        path: "{{ user_home }}/.config/deadbeef"
        state: directory
        mode: "0755"

    - name: Deploy DeaDBeeF configuration
      ansible.builtin.copy:
        src: deadbeef/config
        dest: "{{ user_home }}/.config/deadbeef/config"
        mode: "0644"
