---
# OpenCode multi-agent "swarm" layer (coordinator + workers + review gate).
# Runs on top of the base opencode install (see opencode.yml). Deploys the
# agent/command/knowledge/skills tree, the swarm plugin (Void-adapted paths),
# installs bun (the swarm CLI runtime) and the local node deps that provide the
# `swarm` binary. API keys come from the environment (env.fish ← secrets.yml),
# never plaintext on disk.
- name: OpenCode swarm
  tags: [opencode, opencode-swarm]
  block:
    - name: Ensure opencode config directory exists
      ansible.builtin.file:
        path: "{{ user_home }}/.config/opencode"
        state: directory
        mode: "0755"

    # apiKey fields use {env:DEEPSEEK_API_KEY}/{env:OPENROUTER_API_KEY} so keys
    # never sit in plaintext on disk (env.fish injects them from secrets.yml).
    - name: Deploy opencode config (models, providers, permissions)
      ansible.builtin.copy:
        src: opencode/opencode.json
        dest: "{{ user_home }}/.config/opencode/opencode.json"
        mode: "0644"

    - name: Install or upgrade bun from Nix (swarm CLI runtime)
      ansible.builtin.shell: |
        set -o pipefail
        . ~/.nix-profile/etc/profile.d/nix.sh
        before=$(nix profile list 2>/dev/null | awk '/^Name:[[:space:]]+bun$/{found=1} found && /^Store paths:/{print $NF; found=0}')
        if [ -z "$before" ]; then
          nix {{ dotfiles_nix_experimental_flags }} profile install nixpkgs#bun
        else
          nix {{ dotfiles_nix_experimental_flags }} profile upgrade bun
          after=$(nix profile list 2>/dev/null | awk '/^Name:[[:space:]]+bun$/{found=1} found && /^Store paths:/{print $NF; found=0}')
          [ "$before" = "$after" ] && echo "UNCHANGED"
        fi
      args:
        executable: /bin/bash
      register: dotfiles_bun_install
      changed_when: "'UNCHANGED' not in dotfiles_bun_install.stdout"
      failed_when: dotfiles_bun_install.rc != 0

    - name: Deploy swarm config trees (agents, commands, knowledge, skills)
      ansible.builtin.copy:
        src: "opencode/{{ item }}"
        dest: "{{ user_home }}/.config/opencode/"
        mode: "0644"
        directory_mode: "0755"
      loop:
        - agent
        - command
        - knowledge
        - skills
        - scripts
        - plugins

    - name: Deploy swarm top-level files (AGENTS.md, package.json, README)
      ansible.builtin.copy:
        src: "opencode/{{ item }}"
        dest: "{{ user_home }}/.config/opencode/{{ item }}"
        mode: "0644"
      loop:
        - AGENTS.md
        - package.json
        - README.md

    - name: Ensure opencode plugin directory exists
      ansible.builtin.file:
        path: "{{ user_home }}/.config/opencode/plugin"
        state: directory
        mode: "0755"

    - name: Deploy swarm plugin (Void-adapted spawn paths)
      ansible.builtin.copy:
        src: opencode/plugin/swarm.ts
        dest: "{{ user_home }}/.config/opencode/plugin/swarm.ts"
        mode: "0644"

    # Local install gives the `swarm` CLI at node_modules/.bin/swarm, which the
    # plugin shells out to. npm is the system xbps one; bun is only the runtime.
    - name: Install swarm plugin node deps (provides the swarm CLI)
      ansible.builtin.command:
        cmd: npm install --no-audit --no-fund --no-progress
        chdir: "{{ user_home }}/.config/opencode"
      register: dotfiles_opencode_npm
      changed_when: "'up to date' not in dotfiles_opencode_npm.stdout"

    # ------------------------------------------------------------
    # Ollama for semantic hivemind search
    # ------------------------------------------------------------
    - name: Install or upgrade ollama from Nix
      ansible.builtin.shell: |
        set -o pipefail
        . ~/.nix-profile/etc/profile.d/nix.sh
        before=$(nix profile list 2>/dev/null | awk '/^Name:[[:space:]]+ollama$/{found=1} found && /^Store paths:/{print $NF; found=0}')
        if [ -z "$before" ]; then
          nix {{ dotfiles_nix_experimental_flags }} profile install nixpkgs#ollama
        else
          nix {{ dotfiles_nix_experimental_flags }} profile upgrade ollama
          after=$(nix profile list 2>/dev/null | awk '/^Name:[[:space:]]+ollama$/{found=1} found && /^Store paths:/{print $NF; found=0}')
          [ "$before" = "$after" ] && echo "UNCHANGED"
        fi
      args:
        executable: /bin/bash
      register: dotfiles_ollama_install
      changed_when: "'UNCHANGED' not in dotfiles_ollama_install.stdout"
      failed_when: dotfiles_ollama_install.rc != 0

    - name: Pull nomic-embed-text model for hivemind embeddings
      ansible.builtin.shell: |
        set -o pipefail
        # Start ollama server temporarily
        ollama serve > /dev/null 2>&1 &
        OLLAMA_PID=$!
        # Wait up to 15s for server to be ready
        for i in $(seq 1 15); do
          if curl -sf http://127.0.0.1:11434 > /dev/null 2>&1; then
            break
          fi
          sleep 1
        done
        # Check if model already pulled
        if ollama list 2>/dev/null | grep -q nomic-embed-text; then
          echo "ALREADY_PRESENT"
        else
          ollama pull nomic-embed-text 2>&1
        fi
        kill $OLLAMA_PID 2>/dev/null || true
        wait $OLLAMA_PID 2>/dev/null || true
      args:
        executable: /bin/bash
      register: dotfiles_ollama_model
      changed_when: "'ALREADY_PRESENT' not in dotfiles_ollama_model.stdout"
      failed_when: dotfiles_ollama_model.rc != 0

    # ------------------------------------------------------------
    # Ollama runit service (survives reboots)
    # ------------------------------------------------------------
    - name: Ensure ollama service directory
      ansible.builtin.file:
        path: /etc/sv/ollama
        state: directory
        mode: "0755"
      become: true

    - name: Deploy ollama run script
      ansible.builtin.template:
        src: "{{ role_path }}/files/runit/ollama/run"
        dest: /etc/sv/ollama/run
        mode: "0755"
      become: true

    - name: Enable ollama service
      ansible.builtin.file:
        src: /etc/sv/ollama
        dest: /var/service/ollama
        state: link
      become: true

    # ------------------------------------------------------------
    # UBS bug scanner for worker verify gate
    # ------------------------------------------------------------
    - name: Install or upgrade UBS from Nix
      ansible.builtin.shell: |
        set -o pipefail
        . ~/.nix-profile/etc/profile.d/nix.sh
        before=$(nix profile list 2>/dev/null | awk '/^Name:[[:space:]]+nixpkg-ultimate-bug-scanner$/{found=1} found && /^Store paths:/{print $NF; found=0}')
        if [ -z "$before" ]; then
          nix {{ dotfiles_nix_experimental_flags }} profile install github:RogerNavelsaker/nixpkg-ultimate-bug-scanner
        else
          nix {{ dotfiles_nix_experimental_flags }} profile upgrade nixpkg-ultimate-bug-scanner
          after=$(nix profile list 2>/dev/null | awk '/^Name:[[:space:]]+nixpkg-ultimate-bug-scanner$/{found=1} found && /^Store paths:/{print $NF; found=0}')
          [ "$before" = "$after" ] && echo "UNCHANGED"
        fi
      args:
        executable: /bin/bash
      register: dotfiles_ubs_install
      changed_when: "'UNCHANGED' not in dotfiles_ubs_install.stdout"
      failed_when: dotfiles_ubs_install.rc != 0

    - name: Verify UBS installation
      ansible.builtin.shell: |
        "{{ user_home }}/.nix-profile/bin/ubs" --version
      args:
        executable: /bin/bash
      register: dotfiles_ubs_version
      changed_when: false

    # ------------------------------------------------------------
    # RTK (Rust Token Killer) - CLI proxy for token-efficient output
    # ------------------------------------------------------------
    - name: Install or upgrade RTK binary
      ansible.builtin.shell: |
        set -o pipefail
        INSTALLER=$(mktemp)
        curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/master/install.sh -o "$INSTALLER"
        chmod +x "$INSTALLER"
        sh "$INSTALLER"
        rm -f "$INSTALLER"
      args:
        executable: /bin/bash
        creates: "{{ user_home }}/.local/bin/rtk"
      register: dotfiles_rtk_install

    - name: Activate RTK OpenCode plugin
      ansible.builtin.command:
        cmd: "{{ user_home }}/.local/bin/rtk init -g --opencode"
        creates: "{{ user_home }}/.config/opencode/plugins/rtk.ts"
      register: dotfiles_rtk_init

    - name: Verify RTK installation
      ansible.builtin.command:
        cmd: "{{ user_home }}/.local/bin/rtk --version"
      register: dotfiles_rtk_version
      changed_when: false

    # ------------------------------------------------------------
    # Prod-webhook runit service
    # ------------------------------------------------------------
    - name: Ensure prod-webhook service directory
      ansible.builtin.file:
        path: /etc/sv/prod-webhook
        state: directory
        mode: "0755"
      become: true

    - name: Deploy prod-webhook run script
      ansible.builtin.template:
        src: "{{ role_path }}/files/runit/prod-webhook/run"
        dest: /etc/sv/prod-webhook/run
        mode: "0755"
      become: true

    - name: Create env directory for service environment variables
      ansible.builtin.file:
        path: /etc/sv/prod-webhook/env
        state: directory
        mode: "0755"
      become: true

    - name: Set SWARM_WEBHOOK_SECRET for prod-webhook service
      ansible.builtin.copy:
        content: "{{ swarm_webhook_secret }}"
        dest: /etc/sv/prod-webhook/env/SWARM_WEBHOOK_SECRET
        mode: "0600"
      become: true
      when: swarm_webhook_secret is defined

    - name: Enable prod-webhook service
      ansible.builtin.file:
        src: /etc/sv/prod-webhook
        dest: /var/service/prod-webhook
        state: link
      become: true
