---
- name: VirtualBox
  tags: [virtualbox]
  become: true
  block:
    - name: Install VirtualBox
      community.general.xbps:
        update_cache: false
        name:
          - virtualbox-ose
          - virtualbox-ose-dkms
        state: present

    - name: Add user to vboxusers group
      ansible.builtin.user:
        name: "{{ username }}"
        groups: vboxusers
        append: true

    - name: Load VirtualBox kernel modules
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - vboxdrv
        - vboxnetflt
        - vboxnetadp

    - name: Auto-load VirtualBox modules at boot
      ansible.builtin.copy:
        content: |
          vboxdrv
          vboxnetflt
          vboxnetadp
        dest: /etc/modules-load.d/virtualbox.conf
        mode: "0644"
