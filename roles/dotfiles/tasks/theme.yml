---
# System theming - GTK, Qt, cursors, icons

- name: Theme
  tags: [theme]
  block:
    - name: Install theme packages
      community.general.xbps:
        update_cache: false
        name:
          - papirus-icon-theme # Icon theme
        state: present
      become: true

    - name: Install or upgrade capitaine-cursors via Nix
      ansible.builtin.shell: |
        set -o pipefail
        . ~/.nix-profile/etc/profile.d/nix.sh
        before=$(nix profile list 2>/dev/null | awk '/^Name:[[:space:]]+capitaine-cursors$/{found=1} found && /^Store paths:/{print $NF; found=0}')
        if [ -z "$before" ]; then
          nix {{ dotfiles_nix_experimental_flags }} profile install nixpkgs#capitaine-cursors
        else
          nix {{ dotfiles_nix_experimental_flags }} profile upgrade capitaine-cursors
          after=$(nix profile list 2>/dev/null | awk '/^Name:[[:space:]]+capitaine-cursors$/{found=1} found && /^Store paths:/{print $NF; found=0}')
          [ "$before" = "$after" ] && echo "UNCHANGED"
        fi
      args:
        executable: /bin/bash
      register: dotfiles_capitaine_install
      changed_when: "'UNCHANGED' not in dotfiles_capitaine_install.stdout"
      failed_when: dotfiles_capitaine_install.rc != 0

    # GTK 3 configuration
    - name: Create GTK-3.0 config directory
      ansible.builtin.file:
        path: "{{ user_home }}/.config/gtk-3.0"
        state: directory
        mode: "0755"

    - name: Configure GTK-3.0 dark theme
      ansible.builtin.copy:
        src: theme/gtk-3.0-settings.ini
        dest: "{{ user_home }}/.config/gtk-3.0/settings.ini"
        mode: "0644"

    # GTK 4 configuration
    - name: Create GTK-4.0 config directory
      ansible.builtin.file:
        path: "{{ user_home }}/.config/gtk-4.0"
        state: directory
        mode: "0755"

    - name: Configure GTK-4.0 dark theme
      ansible.builtin.copy:
        src: theme/gtk-4.0-settings.ini
        dest: "{{ user_home }}/.config/gtk-4.0/settings.ini"
        mode: "0644"

    # Set default cursor globally
    - name: Set default X11 cursor
      ansible.builtin.copy:
        src: theme/Xresources
        dest: "{{ user_home }}/.Xresources"
        mode: "0644"

    - name: Configure GTK 2.0 dark theme
      ansible.builtin.copy:
        src: theme/gtkrc-2.0
        dest: "{{ user_home }}/.gtkrc-2.0"
        mode: "0644"

    # Scale UI to ~0.9 (since Sway fractional scale breaks Electron)
    - name: Set GTK text scaling factor to 0.9
      ansible.builtin.command:
        cmd: gsettings set org.gnome.desktop.interface text-scaling-factor 0.9
      become: false
      changed_when: false
