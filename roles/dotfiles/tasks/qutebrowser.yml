---
- name: Qutebrowser
  tags: [qutebrowser]
  block:
    - name: Install qutebrowser
      community.general.xbps:
        update_cache: false
        name: qutebrowser
        state: present
      become: true

    - name: Install qutebrowser dependencies
      community.general.xbps:
        update_cache: false
        name:
          - python3-PyQt5
          - python3-adblock
        state: present
      become: true

    - name: Create qutebrowser config directory
      ansible.builtin.file:
        path: "{{ user_home }}/.config/qutebrowser"
        state: directory
        mode: "0755"

    - name: Install qutebrowser configuration
      ansible.builtin.copy:
        src: qutebrowser/config.py
        dest: "{{ user_home }}/.config/qutebrowser/config.py"
        mode: "0644"

    - name: Install gesture handler script
      ansible.builtin.copy:
        src: qutebrowser/gestures.py
        dest: "{{ user_home }}/.config/qutebrowser/gestures.py"
        mode: "0755"
