# Bluetooth configuration for WirePlumber 0.5+
# AAC codec preference and Bose QC45 settings

monitor.bluez.properties = {
  bluez5.enable-sbc-xq = true
  bluez5.enable-msbc = true
  bluez5.enable-hw-volume = true
  bluez5.headset-roles = [ hsp_hs hsp_ag hfp_hf hfp_ag ]
  bluez5.codecs = [ aac sbc_xq sbc ldac aptx aptx_hd ]
  bluez5.auto-connect = [ hfp_hf hsp_hs a2dp_sink ]
}

# Bose QC45 specific rule - force A2DP sink profile
monitor.bluez.rules = [
  {
    matches = [
      {
        device.name = "bluez_card.{{ bose_mac | replace(':', '_') }}"
      }
    ]
    actions = {
      update-props = {
        device.profile = "a2dp-sink"
      }
    }
  }
]
