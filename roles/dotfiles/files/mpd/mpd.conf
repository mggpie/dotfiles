# MPD Configuration

# Directories
music_directory    "~/Music"
playlist_directory "~/.config/mpd/playlists"

# Database
db_file            "~/.local/state/mpd/database"
log_file           "~/.local/state/mpd/log"
pid_file           "~/.local/state/mpd/pid"
state_file         "~/.local/state/mpd/state"
sticker_file       "~/.local/state/mpd/sticker.sql"

# Network
bind_to_address    "127.0.0.1"
port               "6600"

# Audio Output - PipeWire
audio_output {
    type           "pipewire"
    name           "PipeWire Sound Server"
}

# Audio Output - FIFO for visualization
audio_output {
    type           "fifo"
    name           "FIFO Visualizer"
    path           "/tmp/mpd.fifo"
    format         "44100:16:2"
}

# Performance
audio_buffer_size           "4096"
audio_output_format         "48000:24:2"
buffer_before_play          "10%"
max_output_buffer_size      "16384"

# Character Encoding
filesystem_charset          "UTF-8"

# Auto-update database
auto_update                 "yes"
auto_update_depth           "3"
