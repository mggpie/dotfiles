# mpv configuration - Balanced Setup

###############
# Video Output
###############
vo=gpu                         # Standard GPU renderer
hwdec=auto-safe                # Hardware decoding when possible

###############
# Quality (balanced)
###############
scale=lanczos                  # Good quality, reasonable performance
dscale=mitchell
cscale=lanczos

# Deband - disabled by default (press D to toggle)
deband=no

# Interpolation (smooth motion for 24fps content on 60Hz display)
# Uncomment if you want smoother playback (uses more CPU)
#interpolation=yes
#tscale=oversample
#video-sync=display-resample

###############
# Audio
###############
ao=pipewire                    # PipeWire audio output
volume=100
volume-max=100
audio-pitch-correction=yes     # Keep pitch when changing speed
audio-normalize-downmix=yes    # Normalize audio when downmixing

###############
# Subtitles
###############
sub-auto=fuzzy                 # Load subtitles with similar names
sub-file-paths=sub:subs:subtitles:Subs:Subtitles
sub-font="Inter"
sub-font-size=42
sub-color="#FFFFFFFF"
sub-border-color="#FF000000"
sub-border-size=2.5
sub-shadow-offset=1
sub-shadow-color="#80000000"
sub-spacing=0.5
sub-margin-y=40
blend-subtitles=yes            # Better subtitle rendering

# Prefer Polish subtitles, then English
slang=pl,pol,en,eng

###############
# Languages
###############
alang=en,eng,pl,pol            # Audio: English first, then Polish

###############
# OSD / UI
###############
osd-font="Inter"
osd-font-size=28
osd-color="#CCFFFFFF"
osd-border-color="#DD000000"
osd-border-size=2
osd-bar-h=2
osd-bar-w=60
osd-bar-align-y=0.9
osd-duration=2500
osd-playing-msg="${filename}"
osd-playing-msg-duration=3000
osd-level=1                    # Minimal OSD

# Bar colors (dark theme)
osd-back-color="#80000000"

# Cursor hiding
cursor-autohide=1000
cursor-autohide-fs-only=yes

###############
# Window
###############
keep-open=yes                  # Don't close after playback
autofit-larger=90%x90%         # Max window size 90% of screen
force-window=immediate         # Create window immediately
title="${media-title}"         # Window title

###############
# Seeking
###############
hr-seek=yes                    # Precise seeking
hr-seek-framedrop=yes          # Drop frames when seeking (faster)
save-position-on-quit=yes      # Remember position

###############
# Input / Responsiveness
###############
input-default-bindings=yes
input-vo-keyboard=yes
force-seekable=yes             # Always allow seeking

###############
# Cache / Performance
###############
cache=yes
demuxer-max-bytes=500M         # More cache for network streams
demuxer-max-back-bytes=100M

###############
# Screenshots
###############
screenshot-directory=~/Pictures/Screenshots
screenshot-format=png
screenshot-png-compression=7
screenshot-template="%F-%P"    # filename-timestamp

###############
# YouTube / Streaming
###############
ytdl-format=bestvideo[height<=?1080][vcodec!=?vp9]+bestaudio/best
script-opts=ytdl_hook-ytdl_path=yt-dlp

###############
# Watch Later
###############
watch-later-directory=~/.local/share/mpv/watch_later
write-filename-in-watch-later-config=yes

###############
# Profiles
###############

# Profile for low-end machines
[low-quality]
profile-desc="Low quality for better performance"
vo=gpu
hwdec=auto
scale=bilinear
dscale=bilinear
cscale=bilinear
deband=no

# Profile for music files (no video)
[audio-only]
profile-cond=not vid
profile-restore=copy
force-window=no
video=no

# Profile for streams/live content
[stream]
profile-desc="Settings for streaming"
profile-cond=demuxer_via_network
cache=yes
demuxer-max-bytes=1000M
