# mpv keybindings

# Seeking
LEFT  seek -5
RIGHT seek  5
UP    seek  60
DOWN  seek -60
Shift+LEFT  seek -1 exact
Shift+RIGHT seek  1 exact
l seek  5
h seek -5
j seek -60
k seek  60

# Speed
[ multiply speed 0.9
] multiply speed 1.1
{ multiply speed 0.5
} multiply speed 2.0
BS set speed 1.0               # Backspace resets speed

# Volume
m cycle mute
WHEEL_UP   add volume  2
WHEEL_DOWN add volume -2

# Subtitles
v cycle sub-visibility
V cycle secondary-sub-visibility
z add sub-delay -0.1
Z add sub-delay +0.1
x add sub-delay +0.1
Shift+g add sub-scale +0.1
Shift+f add sub-scale -0.1

# Audio
a cycle audio
A cycle audio down

# Video
SHARP cycle video                # # key
d cycle deinterlace
D cycle deband

# Playlist
< playlist-prev
> playlist-next
ENTER playlist-next

# Screenshot
s screenshot                    # Screenshot with subs
S screenshot video              # Screenshot without subs

# Misc
i script-binding stats/display-stats-toggle
I script-binding stats/display-stats
` script-binding console/enable
q quit
Q quit-watch-later              # Quit and save position
ESC set fullscreen no
f cycle fullscreen
SPACE cycle pause
p cycle pause

# Loop
L cycle-values loop-file "inf" "no"
l cycle-values loop-playlist "inf" "no"

# Aspect ratio
A cycle-values video-aspect-override "16:9" "4:3" "2.35:1" "-1"

# Rotate video
r cycle-values video-rotate 90 180 270 0

# Zoom and pan (Shift + arrow keys)
Alt+LEFT  add video-pan-x  0.05
Alt+RIGHT add video-pan-x -0.05
Alt+UP    add video-pan-y  0.05
Alt+DOWN  add video-pan-y -0.05
Alt++     add video-zoom   0.1
Alt+-     add video-zoom  -0.1
Alt+BS    set video-zoom 0; set video-pan-x 0; set video-pan-y 0
