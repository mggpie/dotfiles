# Audio policy for WirePlumber 0.5+
#
# Streams follow the default sink when it changes.
wireplumber.settings = {
  linking.allow-moving-streams = true
  linking.follow-default-target = true

  # Runtime output swaps (output-toggle, tv) are session-only; boot must always
  # come up on the pinned monitor profile below, not on the last used one.
  device.restore-profile = false
}

# Default profile for the internal card: monitor over HDMI. Runtime switching
# sets profiles explicitly; this only decides what gets selected on startup.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.pci-0000_00_1f.3"
      }
    ]
    actions = {
      update-props = {
        device.profile = "output:hdmi-stereo"
      }
    }
  }
]
