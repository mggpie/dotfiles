<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Set Noto Color Emoji as default emoji font -->
  <alias>
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  
  <!-- Add emoji fallback to monospace fonts -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Intel One Mono</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  
  <!-- Add emoji fallback to sans-serif fonts -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
