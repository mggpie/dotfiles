# TLP configuration for desktop (balanced power profile)
# See: https://linrunner.de/tlp/settings/

# CPU Frequency Scaling
# Use powersave governor with turbo enabled - gives balanced performance
# CPU will scale up when needed but stay low at idle
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave

# CPU Performance vs Energy Trade-off (Intel only)
# balance_performance = responsive but efficient
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power

# CPU Turbo Boost
# Keep turbo enabled - it only activates when needed
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=1

# AMD/Intel Platform Profiles (newer hardware)
# balanced = good middle ground
PLATFORM_PROFILE_ON_AC=balanced
PLATFORM_PROFILE_ON_BAT=balanced

# CPU Min/Max Frequency Limits
# Let CPU scale from min to max as needed
CPU_SCALING_MIN_FREQ_ON_AC=0
CPU_SCALING_MAX_FREQ_ON_AC=0

# Disk Devices
DISK_DEVICES="nvme0n1 sda"

# Disk Advanced Power Management (APM)
# NVMe doesn't use APM, but HDD does
# 254 = maximum performance, disable spin-down
# 192 = balanced - allows some power saving without aggressive spin-down
DISK_APM_LEVEL_ON_AC="254 192"

# Disk Idle Timeout for spin-down
# 0 = disabled for desktop use
DISK_SPINDOWN_TIMEOUT_ON_AC="0 0"

# SATA Link Power Management (for SATA/NVMe)
# max_performance for desktop - prevents latency issues
SATA_LINKPWR_ON_AC=max_performance

# PCIe Active State Power Management (ASPM)
# default = let kernel decide (usually good enough)
PCIE_ASPM_ON_AC=default

# WiFi Power Saving
# Off since you use ethernet, but if you switch to WiFi it won't kill performance
WIFI_PWR_ON_AC=off

# Ethernet - Wake on LAN
# Enable if you use WoL
# WOL_DISABLE=Y

# Audio Power Saving
# Enable power saving for audio when idle (1 second timeout)
SOUND_POWER_SAVE_ON_AC=1

# Runtime Power Management for PCI(e) devices
# Auto-suspend unused devices but keep active ones running
RUNTIME_PM_ON_AC=auto

# USB Autosuspend
# Enable - will suspend unused USB devices
# Excludes input devices by default (mice, keyboards)
USB_AUTOSUSPEND=1

# USB Exclude List - add device IDs if you have issues
# Format: "1111:2222 3333:4444"
# USB_DENYLIST=""

# USB Allowlist - only these will autosuspend
# Leave commented to allow all except denied
# USB_ALLOWLIST=""

# Restore radio device state on startup
RESTORE_DEVICE_STATE_ON_STARTUP=0
