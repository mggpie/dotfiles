# Amfora - Gemini browser configuration
# Tango Dark theme · IntoneMono Nerd Font

[a-general]
home = "gemini://geminiprotocol.net"
auto_redirect = true
http = 'default'
search = "gemini://geminispace.info/search"
color = true
ansi = true
highlight_code = true
highlight_style = "monokai"
bullets = true
show_link = false
max_width = 100
downloads = ''
page_max_size = 2097152
page_max_time = 10
scrollbar = "auto"
underline = true

[auth]
[auth.certs]
[auth.keys]

[commands]

[keybindings]

[url-handlers]
other = 'default'

[[mediatype-handlers]]
cmd = ['imv']
types = ["image"]
no_prompt = true

[[mediatype-handlers]]
cmd = ['mpv', '--force-window', '-']
types = ["audio", "video"]
stream = true
no_prompt = true

[cache]
max_size = 0
max_pages = 50
timeout = 1800

[proxies]

[subscriptions]
popup = true
update_interval = 1800
workers = 3
entries_per_page = 20
header = true

[theme]
# Tango Dark palette
bg                      = "#000000"
fg                      = "#d0cfcc"
tab_num                 = "#3465a4"
tab_divider             = "#555753"
scrollbar               = "#555753"
bottombar_bg            = "#1a1a1a"
bottombar_text          = "#d0cfcc"
bottombar_label         = "#729fcf"

hdg_1                   = "#8ae234"
hdg_2                   = "#729fcf"
hdg_3                   = "#ad7fa8"
amfora_link             = "#729fcf"
foreign_link            = "#e9b96e"
