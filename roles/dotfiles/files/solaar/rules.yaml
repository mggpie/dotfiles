%YAML 1.3
---
# back + forward + smart shift -> tv
- Key: [Smart Shift, pressed]
- KeyIsDown: Back Button
- KeyIsDown: Forward Button
- Execute: tv
...
---
# smart shift + scroll -> volume
- Feature: HIRES WHEEL
- KeyIsDown: Smart Shift
- Rule: [Test: hires_wheel_up, KeyPress: XF86_AudioRaiseVolume]
- Rule: [Test: hires_wheel_down, KeyPress: XF86_AudioLowerVolume]
...
---
# scroll passthrough - must split up/down, single rule scrolls one direction only
- Feature: HIRES WHEEL
- Rule: [Test: hires_wheel_up, MouseScroll: [0, 1]]
- Rule: [Test: hires_wheel_down, MouseScroll: [0, -1]]
...
---
# smart shift alone -> middle click
- Key: [Smart Shift, pressed]
- MouseClick: [middle, 1]
...
---
# back -> workspace prev
- Key: [Back Button, pressed]
- Execute: [swaymsg, workspace, prev]
...
---
# forward -> workspace next
- Key: [Forward Button, pressed]
- Execute: [swaymsg, workspace, next]
...
