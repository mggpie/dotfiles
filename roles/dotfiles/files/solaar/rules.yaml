%YAML 1.3
---
# back + forward + smart shift -> tv
- Key: [Smart Shift, pressed]
- KeyIsDown: Back Button
- KeyIsDown: Forward Button
- Execute: tv
...
---
# back button + scroll -> volume
- Feature: HIRES WHEEL
- KeyIsDown: Forward Button
- Rule: [Test: hires_wheel_up, KeyPress: XF86_AudioRaiseVolume]
- Rule: [Test: hires_wheel_down, KeyPress: XF86_AudioLowerVolume]
...
---
# scroll passthrough - must split up/down, single rule scrolls one direction only
- Feature: HIRES WHEEL
- Rule: [Test: hires_wheel_up, MouseScroll: [0, 1]]
- Rule: [Test: hires_wheel_down, MouseScroll: [0, -1]]
...
---
# forward button (held) + smart shift -> toggle scroll ratchet mode
# hold forward first, then press smart shift; side effect: workspace prev also fires on forward press
- KeyIsDown: Back Button
- Key: [Smart Shift, pressed]
- Rule:
  - Setting: [null, scroll-ratchet, Freespinning]
  - Set: [null, scroll-ratchet, Ratcheted]
- Rule:
  - Set: [null, scroll-ratchet, Freespinning]
...
---
# smart shift alone -> middle click
- Key: [Smart Shift, pressed]
- MouseClick: [middle, 1]
...
---
# back -> workspace next (physical button position is reversed vs solaar labels)
- Key: [Back Button, pressed]
- Execute: [swaymsg, workspace, next]
...
---
# forward -> workspace prev (physical button position is reversed vs solaar labels)
- Key: [Forward Button, pressed]
- Execute: [swaymsg, workspace, prev]
...
