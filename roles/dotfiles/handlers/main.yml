---
- name: Restart bluetoothd
  ansible.builtin.command: sv restart bluetoothd
  changed_when: true
  become: true

- name: Restart dhcpcd
  ansible.builtin.command: sv restart dhcpcd
  changed_when: true
  become: true

- name: Regenerate GRUB config
  ansible.builtin.command: grub-mkconfig -o /boot/grub/grub.cfg
  changed_when: true
  become: true

- name: Apply sysctl settings
  ansible.builtin.command: sysctl --system
  changed_when: true
  become: true

- name: Restart sshd
  # sv restart fails if runit hasn't created supervise/control yet (new service).
  # Retry until runsvdir picks up the new symlink and runsv is ready.
  ansible.builtin.command: sv restart sshd
  changed_when: true
  become: true
  register: sshd_restart
  until: sshd_restart.rc == 0
  retries: 5
  delay: 2
