---
- name: Restart bluetoothd
  ansible.builtin.command: sv restart bluetoothd
  changed_when: true
  become: true

- name: Regenerate GRUB config
  ansible.builtin.command: grub-mkconfig -o /boot/grub/grub.cfg
  changed_when: true
  become: true

- name: Apply sysctl settings
  ansible.builtin.command: sysctl --system
  changed_when: true
  become: true

# solaar overwrites config.yaml on exit, so we must kill it before deploy
# and let sway's exec restart it with the new config
- name: Restart solaar
  ansible.builtin.shell: pkill -f solaar; sleep 1; solaar --window=hide &
  changed_when: true
