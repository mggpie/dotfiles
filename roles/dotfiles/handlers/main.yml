---
- name: Restart bluetoothd
  ansible.builtin.command: sv restart bluetoothd
  changed_when: true
  become: true

- name: Regenerate GRUB config
  ansible.builtin.command: grub-mkconfig -o /boot/grub/grub.cfg
  changed_when: true
  become: true

- name: Apply sysctl settings
  ansible.builtin.command: sysctl --system
  changed_when: true
  become: true

# solaar overwrites config.yaml on exit, so we must kill it before deploy.
# the watchdog (fish -c solaar-watch) keeps respawning it - we just kill solaar
# and the watchdog will restart it 2s later with the new config
- name: Restart solaar
  ansible.builtin.command: pkill -f "solaar --window"
  changed_when: true
  failed_when: false
