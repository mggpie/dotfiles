---
# Base system configuration

- name: Bootstrap - install doas
  community.general.xbps:
    update_cache: false
    name: opendoas
    state: present
  become: true
  become_method: ansible.builtin.su
  tags: [bootstrap]

- name: Bootstrap - configure doas
  ansible.builtin.copy:
    content: |
      permit nopass :wheel
    dest: /etc/doas.conf
    mode: "0400"
  become: true
  become_method: ansible.builtin.su
  tags: [bootstrap]

- name: Install base packages
  community.general.xbps:
    update_cache: false
    name:
      - chrony
      - fontconfig
      - cronie
      - elogind
      - dbus
      - xdg-user-dirs
      - xdg-utils
      - udisks2
      - zip
      - unzip
      - ImageMagick
      - ffmpeg
    state: present
  become: true
  tags: [base]

- name: Enable nonfree repository
  community.general.xbps:
    update_cache: false
    name: void-repo-nonfree
    state: present
  become: true
  tags: [base]

- name: Install CPU microcode
  community.general.xbps:
    update_cache: false
    name: "{{ 'intel-ucode' if cpu_vendor == 'intel' else 'linux-firmware-amd' }}"
    state: present
  become: true
  tags: [base]

- name: Configure auto-login on TTY1
  ansible.builtin.copy:
    content: |
      #!/bin/sh
      exec /sbin/agetty --autologin {{ username }} --noclear tty1 linux
    dest: /etc/sv/agetty-tty1/run
    mode: "0755"
  become: true
  tags: [base]

- name: Disable TTY 3-6
  ansible.builtin.file:
    path: "/var/service/agetty-tty{{ item }}"
    state: absent
  loop: [3, 4, 5, 6]
  become: true
  tags: [base]

- name: Enable base services
  ansible.builtin.file:
    src: "/etc/sv/{{ item }}"
    dest: "/var/service/{{ item }}"
    state: link
  loop:
    - chronyd
    - dbus
    - cronie
  become: true
  tags: [base]

- name: Disable power button in elogind (handled by sway)
  ansible.builtin.lineinfile:
    path: /etc/elogind/logind.conf
    regexp: '^#?HandlePowerKey='
    line: 'HandlePowerKey=ignore'
  become: true
  tags: [base]

- name: SSH only on VMs
  ansible.builtin.file:
    path: /var/service/sshd
    state: "{{ 'link' if ansible_facts.virtualization_role == 'guest' else 'absent' }}"
    src: "{{ '/etc/sv/sshd' if ansible_facts.virtualization_role == 'guest' else omit }}"
    mode: "{{ '0777' if ansible_facts.virtualization_role == 'guest' else omit }}"
  become: true
  tags: [base]

- name: Create XDG directories
  ansible.builtin.file:
    path: "{{ user_home }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - Desktop
    - Downloads
    - Documents
    - Music
    - Pictures
    - Videos
  tags: [base]

# Nix package manager

- name: Check if Nix is installed
  ansible.builtin.stat:
    path: "{{ user_home }}/.nix-profile/etc/profile.d/nix.sh"
  register: dotfiles_nix_installed
  tags: [base, nix]

- name: Install Nix
  ansible.builtin.shell: |
    set -o pipefail
    curl -L https://nixos.org/nix/install | sh -s -- --no-daemon
  args:
    executable: /bin/bash
  when: not dotfiles_nix_installed.stat.exists
  changed_when: true
  tags: [base, nix]

- name: Add nixpkgs unstable channel
  ansible.builtin.shell: |
    . ~/.nix-profile/etc/profile.d/nix.sh
    nix-channel --add https://nixos.org/channels/nixpkgs-unstable nixpkgs
    nix-channel --update
  args:
    executable: /bin/bash
  when: not dotfiles_nix_installed.stat.exists
  changed_when: true
  tags: [base, nix]

- name: Create Nix config directory
  ansible.builtin.file:
    path: "{{ user_home }}/.config/nix"
    state: directory
    mode: "0755"
  tags: [base, nix]

- name: Enable Nix experimental features
  ansible.builtin.copy:
    content: |
      experimental-features = nix-command flakes
    dest: "{{ user_home }}/.config/nix/nix.conf"
    mode: "0644"
  tags: [base, nix]
