---
- name: Create shortcuts directory
  ansible.builtin.file:
    path: "{{ user_home }}/.local/bin"
    state: directory
    mode: "0755"
  tags: [shortcuts]

- name: Deploy shortcuts
  ansible.builtin.copy:
    src: shortcuts/
    dest: "{{ user_home }}/.local/bin/"
    mode: "0755"
  tags: [shortcuts]
