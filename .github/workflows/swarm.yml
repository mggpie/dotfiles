---
name: Swarm CI

on:
  pull_request:
    types: [opened, synchronize]
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create dummy vault and become password files
        run: |
          echo "dummy" > .vault_pass
          echo "dummy" > .become_pass

      - name: Run ansible-lint
        id: ansible_lint
        continue-on-error: true
        uses: ansible/ansible-lint@main

      - name: Format lint output for PR comment
        id: lint_output
        run: |
          if [ "${{ steps.ansible_lint.outcome }}" = "success" ]; then
            echo "LINT_RESULT<<EOF" >> $GITHUB_ENV
            echo "### ansible-lint: :white_check_mark: Passed" >> $GITHUB_ENV
            echo "No lint issues found." >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "LINT_RESULT<<EOF" >> $GITHUB_ENV
            echo "### ansible-lint: :x: Failed" >> $GITHUB_ENV
            echo "Check the lint step output for details." >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi

      - name: Post lint result as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const body = process.env.LINT_RESULT;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  molecule:
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize')
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create dummy vault and become password files
        run: |
          echo "dummy" > .vault_pass
          echo "dummy" > .become_pass

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install molecule molecule-plugins[docker] ansible testinfra

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run molecule test
        run: molecule test
        env:
          ANSIBLE_FORCE_COLOR: "1"

  test-on-merge:
    if: >
      github.event_name == 'pull_request_target'
      && github.event.action == 'closed'
      && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create dummy vault and become password files
        run: |
          echo "dummy" > .vault_pass
          echo "dummy" > .become_pass

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install molecule molecule-plugins[docker] ansible testinfra

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run full molecule test suite
        run: molecule test
        env:
          ANSIBLE_FORCE_COLOR: "1"

      - name: Attempt hivemind sync (open-code integration)
        id: hivemind_sync
        continue-on-error: true
        run: |
          if command -v opencode &> /dev/null; then
            opencode hivemind-sync
            echo "hivemind_sync completed"
          else
            echo "opencode not available in CI - skipping hivemind sync"
          fi
