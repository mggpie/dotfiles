---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create dummy vault and become password files
        run: |
          echo "dummy" > .vault_pass
          echo "dummy" > .become_pass

      - name: Run ansible-lint
        uses: ansible/ansible-lint@main

      - name: Dry-run (--check --diff)
        run: ansible-playbook playbook.yml --check --diff --skip-tags notest --skip-tags always
        env:
          ANSIBLE_FORCE_COLOR: "1"

  molecule:
    runs-on: ubuntu-latest
    needs: ansible-lint
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create dummy vault and become password files
        run: |
          echo "dummy" > .vault_pass
          echo "dummy" > .become_pass

      - name: Install dependencies
        run: |
          pip install molecule molecule-plugins[docker] ansible testinfra

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run molecule test
        run: molecule test
        env:
          ANSIBLE_FORCE_COLOR: "1"
